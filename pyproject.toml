[project]
name = "qq-group-assistant"
version = "0.5.0"
description = "Configurable QQ group administration assistant over OneBot 11"
requires-python = ">=3.11"
dependencies = [
  "nonebot2[fastapi]>=2.4,<3",
  "nonebot-adapter-onebot>=2.4,<3",
  "nonebot-plugin-apscheduler>=0.5,<1",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
qq-group-assistant = "qq_assistant_cli:main"

[tool.nonebot]
plugins = ["qq_group_assistant"]
adapters = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]

[tool.setuptools]
py-modules = ["bot", "join_roster", "qq_group_assistant", "qq_assistant_cli", "web_admin"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
